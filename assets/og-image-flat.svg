<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="FXログ - ルールを、可視化する。">
  <!--
    og-image.svgのフィルタ抜き版(フラット版)。PNG変換専用ソース。
    CloudConvertのSVG→PNG変換がfeDropShadow(filter要素)を処理できず、
    左上セルのゴールド塗りつぶしごと消えてしまう不具合が確認されたため、
    <defs><filter>...</filter></defs>および各<rect>のfilter属性を除去した
    版を別ファイルとして用意した。ブラウザ表示用のog-image.svg(filterあり、
    glowエフェクト付き)はそのまま維持し、本ファイルはPNG変換時のみ使用する。
    viewBox・サイズ・テキスト内容はog-image.svgと完全に同一。
  -->
  <rect x="0" y="0" width="1200" height="630" fill="#0A0E1A" />
  <!-- ロゴマーク(size=160相当) -->
  <rect x="540.8" y="100.8" width="54.4" height="54.4" rx="12" fill="#FFD54F" />
  <rect x="604.8" y="100.8" width="54.4" height="54.4" rx="12" fill="none" stroke="#FFFFFF" stroke-width="3.3" />
  <rect x="540.8" y="164.8" width="54.4" height="54.4" rx="12" fill="none" stroke="#FFFFFF" stroke-width="3.3" />
  <rect x="604.8" y="164.8" width="54.4" height="54.4" rx="12" fill="none" stroke="#FFFFFF" stroke-width="3.3" />
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="80" font-weight="700" fill="#FFD54F">FXログ</text>
  <text x="600" y="395" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="40" font-weight="600" fill="#FFFFFF">ルールを、可視化する。</text>
  <text x="600" y="580" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="500" fill="#9CA3AF" letter-spacing="1">fxlog.link-ai17.jp</text>
</svg>
